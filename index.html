 <body data-template-id="__page-root" class="w-full">

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreOutput = document.getElementById('score');
      const livesOutput = document.getElementById('lives');
      const finalOutput = document.getElementById('final-score');
      const overlay = document.getElementById('game-over');
      const pressed = new Set();
      const pointerControls = new Map();
      const ship = {x:0,y:0,radius:19};
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const stars = Array.from({length:95},(_,i)=>({
        x:((i*127.73)%997)/997,y:((i*311.21)%991)/991,
        r:i%13===0?1.35:.55,alpha:.12+(i%6)*.08
      }));
      let width=800,height=450,score=0,lives=3,over=false;
      let enemies=[],bullets=[],sparks=[],invulnerable=0,lastTime=0,shotAt=0;

      function resize() {
        const rect=canvas.getBoundingClientRect();
        width=rect.width; height=rect.height;
        const dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ship.x=Math.max(25,Math.min(width-25,ship.x||width*.2));
        ship.y=Math.max(25,Math.min(height-25,ship.y||height*.5));
      }
      function spawnEnemy() {
        const radius=17+Math.random()*15;
        enemies.push({
          x:width*(.45+Math.random()*.55),y:radius+Math.random()*Math.max(1,height-radius*2),
          vx:(Math.random()-.6)*115,vy:(Math.random()-.5)*145,
          radius,rotation:Math.random()*6,spin:(Math.random()-.5)*1.2,
          shape:Array.from({length:11},()=>.78+Math.random()*.3),
          craters:Array.from({length:4},()=>({x:(Math.random()-.5)*.9,y:(Math.random()-.5)*.9,r:.09+Math.random()*.12}))
        });
      }
      function reset() {
        score=0;lives=3;over=false;invulnerable=1.5;
        bullets=[];enemies=[];sparks=[];pressed.clear();pointerControls.clear();
        document.querySelectorAll('[data-control]').forEach(b=>b.classList.remove('active'));
        ship.x=width*.2;ship.y=height*.5;
        scoreOutput.textContent='0';livesOutput.textContent='3';
        overlay.hidden=true;
        for(let i=0;i<4;i++) spawnEnemy();
      }
      function shoot() {
        if(over) return;
        const now=performance.now();
        if(now-shotAt<140) return;
        shotAt=now;
        bullets.push({x:ship.x+24,y:ship.y,vx:650});
      }
      function burst(x,y,color,count) {
        if(reducedMotion) return;
        for(let i=0;i<count;i++) {
          const a=Math.random()*Math.PI*2,s=35+Math.random()*125;
          sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,color});
        }
      }
      function endGame() {
        over=true;pressed.clear();pointerControls.clear();
        finalOutput.textContent=String(score);
        overlay.hidden=false;
        document.getElementById('restart').focus();
      }
      function active(d) {return pressed.has(d)||[...pointerControls.values()].includes(d);}
      function update(dt) {
        for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
        sparks=sparks.filter(p=>p.life>0);
        if(over) return;
        invulnerable=Math.max(0,invulnerable-dt);
        let dx=Number(active('right'))-Number(active('left'));
        let dy=Number(active('down'))-Number(active('up'));
        if(dx&&dy){dx*=Math.SQRT1_2;dy*=Math.SQRT1_2;}
        ship.x=Math.max(26,Math.min(width-29,ship.x+dx*290*dt));
        ship.y=Math.max(26,Math.min(height-26,ship.y+dy*290*dt));
        for(const b of bullets)b.x+=b.vx*dt;
        bullets=bullets.filter(b=>b.x<width+15);
        for(const e of enemies) {
          e.x+=e.vx*dt;e.y+=e.vy*dt;e.rotation+=e.spin*dt;
          if(e.x>width+e.radius)e.x=-e.radius;
          if(e.x< -e.radius)e.x=width+e.radius;
          if(e.y>height+e.radius)e.y=-e.radius;
          if(e.y< -e.radius)e.y=height+e.radius;
          if(invulnerable===0&&Math.hypot(e.x-ship.x,e.y-ship.y)<e.radius+ship.radius*.7){
            lives--;livesOutput.textContent=String(lives);invulnerable=1.6;
            burst(ship.x,ship.y,'#9bc9d2',16);
            e.x=width*.8;e.y=Math.random()*height;
            if(lives<=0){endGame();return;}
          }
        }
        for(let i=bullets.length-1;i>=0;i--){
          for(let j=enemies.length-1;j>=0;j--){
            if(Math.hypot(bullets[i].x-enemies[j].x,bullets[i].y-enemies[j].y)<enemies[j].radius+4){
              burst(enemies[j].x,enemies[j].y,'#dfaa78',14);
              enemies.splice(j,1);bullets.splice(i,1);
              score+=10;scoreOutput.textContent=String(score);
              spawnEnemy();break;
            }
          }
        }
      }
      function drawMeteor(e) {
        ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rotation);
        ctx.shadowColor='rgba(220,150,100,.24)';ctx.shadowBlur=16;
        ctx.beginPath();
        e.shape.forEach((v,i)=>{
          const a=i*Math.PI*2/e.shape.length,r=e.radius*v;
          if(i)ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
          else ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        });
        ctx.closePath();
        const rock=ctx.createLinearGradient(-e.radius,-e.radius,e.radius,e.radius);
        rock.addColorStop(0,'#a29485');rock.addColorStop(.38,'#605d5b');rock.addColorStop(1,'#292f34');
        ctx.fillStyle=rock;ctx.fill();ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(222,205,182,.48)';ctx.lineWidth=1;ctx.stroke();
        for(const c of e.craters){
          ctx.beginPath();ctx.ellipse(c.x*e.radius,c.y*e.radius,c.r*e.radius,c.r*e.radius*.75,.4,0,Math.PI*2);
          ctx.fillStyle='rgba(19,24,28,.45)';ctx.fill();
          ctx.strokeStyle='rgba(220,205,181,.17)';ctx.stroke();
        }
        ctx.restore();
      }
      function drawShip() {
        if(over||(invulnerable>0&&Math.floor(invulnerable*8)%2))return;
        ctx.save();ctx.translate(ship.x,ship.y);
        ctx.shadowColor='rgba(135,206,220,.42)';ctx.shadowBlur=15;
        ctx.fillStyle='#425665';ctx.strokeStyle='#a9c1c9';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(-14,-12);ctx.lineTo(-21,-18);
        ctx.lineTo(-18,-4);ctx.lineTo(-24,0);ctx.lineTo(-18,4);
        ctx.lineTo(-21,18);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.shadowBlur=0;
        ctx.fillStyle='#829ba7';ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(-10,-6);ctx.lineTo(-4,0);ctx.lineTo(-10,6);ctx.closePath();ctx.fill();
        ctx.fillStyle='#162b39';ctx.beginPath();ctx.ellipse(3,0,8,4,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#b7dce0';ctx.stroke();
        const flame=ctx.createLinearGradient(-21,0,-37,0);
        flame.addColorStop(0,'rgba(255,190,120,.9)');flame.addColorStop(1,'rgba(255,190,120,0)');
        ctx.fillStyle=flame;ctx.beginPath();ctx.moveTo(-21,-4);ctx.lineTo(-37,0);ctx.lineTo(-21,4);ctx.fill();
        ctx.restore();
      }
      function draw() {
        ctx.clearRect(0,0,width,height);
        const haze=ctx.createRadialGradient(width*.65,height*.42,5,width*.65,height*.42,width*.75);
        haze.addColorStop(0,'#172532');haze.addColorStop(1,'#060c16');
        ctx.fillStyle=haze;ctx.fillRect(0,0,width,height);
        for(const s of stars){
          ctx.fillStyle=`rgba(212,231,238,${s.alpha})`;
          ctx.beginPath();ctx.arc(s.x*width,s.y*height,s.r,0,Math.PI*2);ctx.fill();
        }
        for(const e of enemies)drawMeteor(e);
        for(const b of bullets){
          ctx.shadowColor='#e8ba77';ctx.shadowBlur=10;ctx.fillStyle='#f4d29f';
          ctx.beginPath();ctx.ellipse(b.x,b.y,6,2,0,0,Math.PI*2);ctx.fill();
        }
        ctx.shadowBlur=0;
        for(const p of sparks){
          ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.fillStyle=p.color;
          ctx.fillRect(p.x,p.y,2,2);
        }
        ctx.globalAlpha=1;
        drawShip();
      }
      function frame(time){
        const dt=Math.min((time-lastTime)/1000||0,.05);lastTime=time;
        update(dt);draw();requestAnimationFrame(frame);
      }
      const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
      window.addEventListener('keydown',e=>{
        const direction=keyMap[e.key.toLowerCase?.()||e.key];
        if(direction){e.preventDefault();pressed.add(direction);}
        if(e.code==='Space'){
          e.preventDefault();
          if(!e.repeat){if(over)reset();else shoot();}
        }
      });
      window.addEventListener('keyup',e=>{
        const direction=keyMap[e.key.toLowerCase?.()||e.key];
        if(direction)pressed.delete(direction);
      });
      window.addEventListener('blur',()=>{
        pressed.clear();pointerControls.clear();
        document.querySelectorAll('[data-control]').forEach(b=>b.classList.remove('active'));
      });
      document.querySelectorAll('[data-control]').forEach(button=>{
        button.addEventListener('pointerdown',e=>{
          e.preventDefault();button.setPointerCapture(e.pointerId);
          pointerControls.set(e.pointerId,button.dataset.control);button.classList.add('active');
        });
        const release=e=>{pointerControls.delete(e.pointerId);button.classList.remove('active');};
        button.addEventListener('pointerup',release);
        button.addEventListener('pointercancel',release);
        button.addEventListener('click',e=>{
          if(e.detail!==0||over)return;
          const d=button.dataset.control;
          ship.x=Math.max(26,Math.min(width-29,ship.x+(d==='right'?30:d==='left'?-30:0)));
          ship.y=Math.max(26,Math.min(height-26,ship.y+(d==='down'?30:d==='up'?-30:0)));
        });
      });
      document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot();});
      document.getElementById('fire').addEventListener('click',e=>{if(e.detail===0)shoot();});
      document.getElementById('restart').addEventListener('click',reset);
      new ResizeObserver(resize).observe(canvas);
      resize();reset();requestAnimationFrame(frame);
    })();
  </script>
